name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.REELFREE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/reelfree-release.jks"
            echo "REELFREE_KEYSTORE_PATH=$RUNNER_TEMP/reelfree-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::REELFREE_KEYSTORE_BASE64 secret not set; release APK will be signed with a throwaway debug key."
          fi

      - name: Build APKs
        env:
          REELFREE_KEYSTORE_PASSWORD: ${{ secrets.REELFREE_KEYSTORE_PASSWORD }}
          REELFREE_KEY_PASSWORD: ${{ secrets.REELFREE_KEYSTORE_PASSWORD }}
          REELFREE_KEY_ALIAS: reelfree
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ReelFree-${GITHUB_REF_NAME//\//-}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/ReelFree-${GITHUB_REF_NAME//\//-}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelFree-apk
          path: out/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
