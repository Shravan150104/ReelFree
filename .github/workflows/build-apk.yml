name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.REELFREE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REELFREE_KEYSTORE_PASSWORD }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Release builds need both REELFREE_KEYSTORE_BASE64 and REELFREE_KEYSTORE_PASSWORD secrets."
              exit 1
            fi
            echo "::warning::Signing secrets not set; release APK will be signed with a throwaway debug key."
            exit 0
          fi
          # Drop anything outside the base64 alphabet (CR/LF, spaces, BOM) that Windows shells may add.
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/reelfree-release.jks"
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          keytool -list -keystore "$RUNNER_TEMP/reelfree-release.jks" -storepass "$PW" -alias reelfree > /dev/null \
            || { echo "::error::Keystore secret or password is wrong."; exit 1; }
          echo "REELFREE_KEYSTORE_PATH=$RUNNER_TEMP/reelfree-release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          REELFREE_KEYSTORE_PASSWORD: ${{ secrets.REELFREE_KEYSTORE_PASSWORD }}
          REELFREE_KEY_PASSWORD: ${{ secrets.REELFREE_KEYSTORE_PASSWORD }}
          REELFREE_KEY_ALIAS: reelfree
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ReelFree-${GITHUB_REF_NAME//\//-}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/ReelFree-${GITHUB_REF_NAME//\//-}-debug.apk

      - uses: actions/upload-artifact@v5
        with:
          name: ReelFree-apk
          path: out/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
